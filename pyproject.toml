[tool.black]
line-length = 120

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.1"
update_changelog_on_bump = true
version_files = [
    "pyproject.toml:version",
    "version.py:version",
]

[project]
name = "quail"
version = "1.0.1"
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "codespell>=2.4.3",
    "flake8>=7.3.0",
    "galah-python>=0.13.4",
    "isort>=8.0.1",
    "myst-parser>=5.1.0",
    "renku-sphinx-theme>=0.5.2",
    "shibuya>=2026.7.12",
    "sphinx>=9.1.0",
    "sphinx-design>=0.7.0",
]
